<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linknest - Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-card">
    <!-- Brand Logo -->
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      Linknest
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <a>Login</a>
    </div>

    <!-- Title Section -->
    <h1 class="title">Welcome back.</h1>
    <p class="subtitle">Sign in to your Linknest account.</p>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <div class="input-wrapper">
          <input id="loginEmail" type="email" class="form-input" placeholder="Enter your email" required>
        </div>
        <div class="field-error" id="loginEmailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="input-wrapper">
          <input id="loginPassword" type="password" class="form-input" placeholder="Your password" required>
          <button type="button" id="loginToggle" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <a href="#" class="forgot-pass">Forgot password?</a>
        <div class="field-error" id="loginPasswordError"></div>
      </div>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <!-- Footer Link -->
    <p class="footer-text">
      New to Linknest? <a href="register.html">Create an account</a>
    </p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
